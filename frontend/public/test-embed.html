<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Embedding Agenda</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        h1 {
            color: #333;
        }
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        select, input {
            margin: 5px;
            padding: 5px;
        }
        .debug-info {
            margin-top: 20px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Test de Embedding Agenda</h1>
    
    <div class="controls">
        <h3>Controles de prueba:</h3>
        <select id="themeSelect" onchange="updateIframe()">
            <option value="light">Tema Claro</option>
            <option value="dark">Tema Oscuro</option>
        </select>
        <select id="limitSelect" onchange="updateIframe()">
            <option value="6">6 eventos</option>
            <option value="12" selected>12 eventos</option>
            <option value="24">24 eventos</option>
        </select>
        <input type="text" id="cityInput" placeholder="Ciudad" onchange="updateIframe()">
        <input type="text" id="genreInput" placeholder="Género" onchange="updateIframe()">
    </div>

    <!-- Herramienta de testeo para event_id -->
    <div style="margin: 2rem 0; padding: 1rem; background: #f5f5f5; border-radius: 8px; max-width: 600px;">
        <h3>Test embed with event_id</h3>
        <label for="eventIdInput">Event ID:</label>
        <input type="text" id="eventIdInput" style="margin: 0 1rem 0 0; padding: 0.25rem 0.5rem; border-radius: 4px; border: 1px solid #ccc;" />
        <button onclick="reloadWithEventId()" style="padding: 0.25rem 1rem; border-radius: 4px; background: #1752F9; color: #fff; border: none;">Load Event</button>
        <button onclick="reloadWithoutEventId()" style="padding: 0.25rem 1rem; border-radius: 4px; background: #aaa; color: #fff; border: none; margin-left: 0.5rem;">Clear</button>
        <script>
            function reloadWithEventId() {
                const id = document.getElementById('eventIdInput').value.trim();
                const iframe = document.getElementById('agendaFrame'); // Changed from 'agenda-embed' to 'agendaFrame'
                if (id) {
                    const url = new URL(iframe.src);
                    url.searchParams.set('event_id', id);
                    iframe.src = url.toString();
                }
            }
            function reloadWithoutEventId() {
                const iframe = document.getElementById('agendaFrame'); // Changed from 'agenda-embed' to 'agendaFrame'
                const url = new URL(iframe.src);
                url.searchParams.delete('event_id');
                iframe.src = url.toString();
                document.getElementById('eventIdInput').value = '';
            }
        </script>
    </div>

    <div class="container">
        <h2>Agenda Embebida:</h2>
        <iframe 
            id="agendaFrame"
            src="http://localhost:3000/embed"
            width="100%" 
            height="600px" 
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; geolocation"
            allowfullscreen
        ></iframe>
    </div>

    <div class="debug-info">
        <h3>Información de depuración:</h3>
        <div id="debugContent"></div>
    </div>

    <script>
        function updateIframe() {
            const theme = document.getElementById('themeSelect').value;
            const limit = document.getElementById('limitSelect').value;
            const city = document.getElementById('cityInput').value;
            const genre = document.getElementById('genreInput').value;

            let url = 'http://localhost:3000/embed?';
            const params = new URLSearchParams();
            
            if (theme) params.append('theme', theme);
            if (limit) params.append('limit', limit);
            if (city) params.append('city', city);
            if (genre) params.append('genre', genre);

            const finalUrl = url + params.toString();
            document.getElementById('agendaFrame').src = finalUrl;
            
            // Actualizar información de depuración
            document.getElementById('debugContent').innerHTML = `
                <p>URL actual: ${finalUrl}</p>
                <p>Parámetros:</p>
                <ul>
                    <li>Tema: ${theme}</li>
                    <li>Límite: ${limit}</li>
                    <li>Ciudad: ${city || 'ninguna'}</li>
                    <li>Género: ${genre || 'ninguno'}</li>
                </ul>
            `;
        }

        // Inicializar información de depuración
        updateIframe();

        // Manejar errores del iframe
        window.addEventListener('message', function(event) {
            if (event.origin === 'http://localhost:3000') {
                console.log('Mensaje recibido del iframe:', event.data);
            }
        });

        // Manejar errores de carga del iframe
        document.getElementById('agendaFrame').onerror = function() {
            console.error('Error al cargar el iframe');
            document.getElementById('debugContent').innerHTML += '<p style="color: red;">Error al cargar el iframe</p>';
        };
    </script>
</body>
</html>
